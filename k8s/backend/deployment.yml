apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: cloudforge-dev
  labels:
    app: backend
    environment: dev
    project: cloudforge

spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0

  selector:
    matchLabels:
      app: backend

  template:
    metadata:
      labels:
        app: backend
        environment: dev

    spec:
      containers:
        - name: backend
          image: 125167623870.dkr.ecr.us-east-1.amazonaws.com/cloudforge-dev-backend:latest
          imagePullPolicy: Always

          ports:
            - name: http
              containerPort: 5000

          envFrom:
            - configMapRef:
                name: backend-config
            - secretRef:
                name: backend-secret

          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

          resources:
            requests:
              cpu: "150m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"