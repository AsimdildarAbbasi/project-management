apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: pma

spec:
  replicas: 1

  selector:
    matchLabels:
      app: frontend

  template:
    metadata:
      labels:
        app: frontend

    spec:
      containers:
        - name: frontend
          image: asimabbasi1029/pma-frontend:latest
          imagePullPolicy: Always

          ports:
            - containerPort: 5173

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"

            limits:
              cpu: "500m"
              memory: "512Mi"